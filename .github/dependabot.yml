# Dependabot schedule uses cron for load distribution.
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cron: '5 4 * * 1'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'skvarel'
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cron: '15 4 * * 1'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'skvarel'
